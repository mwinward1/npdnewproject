<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Lookup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-weather="clear" data-time="day">
  <div id="sky" class="sky" aria-hidden="true"></div>

  <main>
    <h1>Weather Lookup</h1>

    <form id="search-form" autocomplete="off" novalidate>
      <div class="search-box">
        <input
          id="city-input"
          type="text"
          placeholder="Enter a city, e.g. London"
          aria-label="City"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="suggestions"
        />
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </div>
      <button type="submit">Search</button>
    </form>

    <p id="status" role="status"></p>

    <section id="result" hidden>
      <p id="nearby" class="nearby" hidden>📍 Near you, based on your approximate location</p>
      <h2 id="location"></h2>
      <div class="current">
        <div id="art" class="art" aria-hidden="true"></div>
        <div>
          <span id="temperature" class="temperature"></span>
          <p id="description" class="description"></p>
        </div>
      </div>
      <p id="tip" class="tip"></p>
      <dl class="details">
        <div><dt>Feels like</dt><dd id="feels-like"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
      </dl>

      <h3>Next 7 days</h3>
      <ul id="forecast" class="forecast"></ul>
    </section>

    <footer>
      Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
      · Location by <a href="https://www.geojs.io/" target="_blank" rel="noopener">GeoJS</a>
    </footer>
  </main>

  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
