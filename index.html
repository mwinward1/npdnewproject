<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Lookup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Weather Lookup</h1>

    <form id="search-form" autocomplete="off">
      <input id="city-input" type="text" placeholder="Enter a city, e.g. London" required aria-label="City" />
      <button type="submit">Search</button>
    </form>

    <p id="status" role="status"></p>

    <section id="result" hidden>
      <h2 id="location"></h2>
      <div class="current">
        <span id="icon" class="icon"></span>
        <span id="temperature" class="temperature"></span>
      </div>
      <p id="description" class="description"></p>
      <dl class="details">
        <div><dt>Feels like</dt><dd id="feels-like"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
      </dl>

      <h3>Next 7 days</h3>
      <ul id="forecast" class="forecast"></ul>
    </section>

    <footer>
      Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
